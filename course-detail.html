    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Helper to get query params
            function getQueryParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            const courseId = getQueryParam('id');
            if (!courseId) {
                // If no ID, maybe redirect or show a default/placeholder? 
                // For now, we just log it.
                console.log("No course ID provided.");
                return;
            }

            // Fetch course data
            fetch('assets/data/courses.json')
                .then(response => response.json())
                .then(data => {
                    const course = data.courses.find(c => c.id == courseId);
                    
                    if (course) {
                        // 1. Basic Info
                        document.title = course.title + " - Turn Worth Academy";
                        document.querySelector('.breadcrumb-content__title').textContent = course.title;
                        
                        // Breadcrumb trailing item
                        const breadcrumbItems = document.querySelector('.breadcrumb-content__items li:last-child');
                        if (breadcrumbItems) breadcrumbItems.textContent = course.title;

                        document.getElementById('course-title').textContent = course.title;
                        document.getElementById('course-category').textContent = course.category || 'General';
                        // document.getElementById('course-category-text').textContent = course.category || 'General';
                        // document.getElementById('instructor-name').textContent = course.instructor || 'Turn Worth Team';
                        document.getElementById('course-description').textContent = course.description;
                        
                        // Images
                        const imgPath = course.image || 'assets/images/course/course-details-thumb1.jpg';
                        // Safely check if elements exist before setting
                        const mainImage = document.getElementById('course-image');
                        if (mainImage) mainImage.src = imgPath;
                        
                        const sidebarImage = document.getElementById('course-sidebar-image');
                        if (sidebarImage) sidebarImage.src = imgPath;

                        // Rating
                        const ratingContainer = document.getElementById('course-rating');
                        ratingContainer.innerHTML = '';
                        // Simple 5 star logic (all full for now as per JSON default)
                        for(let i=0; i<5; i++) {
                            ratingContainer.innerHTML += '<li><i class="fa-solid fa-star-sharp"></i></li>';
                        }
                        document.getElementById('course-rating-count').textContent = `(${course.rating}.000)`;

                        // Sidebar Stats
                        document.getElementById('sidebar-lessons').textContent = course.lessons;
                        document.getElementById('sidebar-students').textContent = course.students;
                        
                        // 2. Extended Details (if available)
                        const details = course.details;
                        const extendedContainer = document.getElementById('extended-details');
                        extendedContainer.innerHTML = ''; // Clear

                        if (details) {
                            // Update sidebar with real data if available
                            if (details.training_info) {
                                if (details.training_info.duration) document.getElementById('sidebar-duration').textContent = details.training_info.duration;
                                if (details.training_info.language) document.getElementById('sidebar-language').textContent = details.training_info.language;
                            }

                            // Overview Section
                            if (details.overview) {
                                if (details.overview.what_is) {
                                    extendedContainer.innerHTML += `<h4 class="mt-4 course-details__title">What is ${course.title || 'this course'}?</h4><p class="course-details__text">${details.overview.what_is}</p>`;
                                }
                                if (details.overview.about) {
                                    extendedContainer.innerHTML += `<h4 class="mt-4 course-details__title">About the Course</h4><p class="course-details__text">${details.overview.about}</p>`;
                                }
                            }

                            // Roles & Responsibilities
                            if (details.roles_responsibilities && details.roles_responsibilities.length > 0) {
                                let rolesHtml = '<h4 class="mt-4 course-details__title">Roles & Responsibilities</h4><ul class="course-details__list">';
                                details.roles_responsibilities.forEach(item => {
                                    rolesHtml += `<li><span><img src="assets/images/event/check.svg" alt="icon"></span>${item}</li>`;
                                });
                                rolesHtml += '</ul>';
                                extendedContainer.innerHTML += rolesHtml;
                            }

                            // Course Features
                            if (details.course_features && details.course_features.length > 0) {
                                let featHtml = '<h4 class="mt-4 course-details__title">Course Features</h4><ul class="course-details__list">';
                                details.course_features.forEach(item => {
                                    featHtml += `<li><span><img src="assets/images/event/check.svg" alt="icon"></span>${item}</li>`;
                                });
                                featHtml += '</ul>';
                                extendedContainer.innerHTML += featHtml;
                            }

                            // Training Info (Extended)
                            if (details.training_info) {
                                let trainHtml = '<h4 class="mt-4 course-details__title">Training Details</h4>';
                                const tInfo = details.training_info;
                                
                                if (tInfo.description) {
                                    trainHtml += `<p class="course-details__text">${tInfo.description}</p>`;
                                }

                                trainHtml += '<ul class="course-details__list">';
                                if(tInfo.mode) trainHtml += `<li><strong>Mode:</strong> ${tInfo.mode}</li>`;
                                if(tInfo.eligibility) trainHtml += `<li><strong>Eligibility:</strong> ${tInfo.eligibility}</li>`;
                                if(tInfo.prerequisite) trainHtml += `<li><strong>Prerequisite:</strong> ${tInfo.prerequisite}</li>`;
                                trainHtml += '</ul>';
                                // Only append if we actually added items (checking length of string or just relying on existence of object which we did)
                                extendedContainer.innerHTML += trainHtml;
                            }

                            // Exam Overview
                            if (details.exam_overview) {
                                let examHtml = '<h4 class="mt-4 course-details__title">Exam Overview</h4><ul class="course-details__list">';
                                const exam = details.exam_overview;
                                // Map keys to readable labels if needed, or just iterate specific ones
                                const examFields = {
                                    "conducted_by": "Conducted By",
                                    "exam_type": "Exam Type",
                                    "duration": "Duration",
                                    "total_questions": "Total Questions",
                                    "passing_score": "Passing Score",
                                    "manuals": "Manuals",
                                    "format": "Format"
                                };
                                
                                for (const [key, label] of Object.entries(examFields)) {
                                    if(exam[key]) {
                                        examHtml += `<li><strong>${label}:</strong> ${exam[key]}</li>`;
                                    }
                                }
                                examHtml += '</ul>';
                                extendedContainer.innerHTML += examHtml;
                            }

                            // Curriculum
                            if (details.curriculum && details.curriculum.length > 0) {
                                let currHtml = '<h4 class="mt-4 course-details__title">Curriculum</h4><ul class="course-details__list">';
                                details.curriculum.forEach(item => {
                                    currHtml += `<li><span><img src="assets/images/event/check.svg" alt="icon"></span>${item}</li>`;
                                });
                                currHtml += '</ul>';
                                extendedContainer.innerHTML += currHtml;
                            }

                            // Academy Benefits
                            if (details.academy_benefits && details.academy_benefits.length > 0) {
                                let benHtml = '<h4 class="mt-4 course-details__title">Academy Benefits</h4><ul class="course-details__list">';
                                details.academy_benefits.forEach(item => {
                                    benHtml += `<li><span><img src="assets/images/event/check.svg" alt="icon"></span>${item}</li>`;
                                });
                                benHtml += '</ul>';
                                extendedContainer.innerHTML += benHtml;
                            }

                            // Verify FAQs
                            if (details.faqs && details.faqs.length > 0) {
                                const faqSection = document.getElementById('faq-section');
                                const faqAccordion = document.getElementById('faqAccordion');
                                faqSection.style.display = 'block';
                                faqAccordion.innerHTML = '';

                                details.faqs.forEach((faq, index) => {
                                    const id = `collapse${index}`;
                                    const expanded = index === 0 ? 'true' : 'false';
                                    const showClass = index === 0 ? 'show' : '';
                                    const collapsedClass = index === 0 ? '' : 'collapsed';

                                    const html = `
                                    <div class="global-accordion-item">
                                        <div class="global-accordion-header">
                                            <div class="global-accordion-button ${collapsedClass}"
                                                data-bs-toggle="collapse" role="group"
                                                data-bs-target="#${id}"
                                                aria-expanded="${expanded}"
                                                aria-controls="${id}">
                                                <div class="question">${faq.question}</div>
                                                <span class="icon"><i class="fa-solid fa-angles-right"></i></span>
                                                <span class="icon2"><i class="fa-solid fa-angles-down"></i></span>
                                            </div>
                                        </div>
                                        <div id="${id}" class="global-accordion-collapse collapse ${showClass}" data-bs-parent="#faqAccordion">
                                            <div class="global-accordion-body">
                                                <p>${faq.answer}</p>
                                            </div>
                                        </div>
                                    </div>`;
                                    faqAccordion.innerHTML += html;
                                });
                            }
                        } else {
                            // Render minimal static info if no extended details
                            // (Already handled by basic info above)
                        }


                    } else {
                        console.error('Course not found');
                        document.querySelector('.course-details').innerHTML = '<div class="container"><h3 class="text-center my-5">Course not found</h3></div>';
                    }
                })
                .catch(err => console.error('Error fetching courses:', err));
        });
    </script>
